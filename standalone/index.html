<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			background-color: #0f0f0f;
			overflow: hidden;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.startup {
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.startup img {
			width: 18vmin;
			min-width: 160px;
			max-width: 280px;
			height: auto;
		}

		.startup-progress {
			width: 160px;
			height: 3px;
			margin-top: 28px;
			overflow: hidden;
			background: #303030;
		}

		.startup-progress::after {
			display: block;
			width: 45%;
			height: 100%;
			content: "";
			background: #ff0033;
			animation: startup-progress 1.1s ease-in-out infinite;
		}

		@keyframes startup-progress {
			from {
				transform: translateX(-110%);
			}

			to {
				transform: translateX(245%);
			}
		}
	</style>
</head>

<body>
	<main class="startup">
		<img src="icon.png" alt="">
		<div class="startup-progress"></div>
	</main>

	<script>
		"use strict";
		tizen.tvinputdevice.registerKey("ColorF0Red");
		tizen.tvinputdevice.registerKey("ColorF1Green");
		tizen.tvinputdevice.registerKey("ColorF2Yellow");
		tizen.tvinputdevice.registerKey("ColorF3Blue");

		const keys = [
			"MediaPlayPause",
			"MediaPlay",
			"MediaPause",
			"MediaStop",
			"MediaFastForward",
			"MediaRewind",
			"MediaTrackNext",
			"MediaTrackPrevious"
		];

		for (let i = 0; i < keys.length; i++) {
			tizen.tvinputdevice.registerKey(keys[i]);
		}

		const pkgId = tizen.application.getCurrentApplication().appInfo.packageId;

		const serviceId = pkgId + ".StandaloneService";

		function useInjectorOrProxy() {
			const data = tizen.application.getCurrentApplication().getRequestedAppControl().appControl.data;
			let args;
			try {
				args = JSON.parse(data[0].value[0]).args;
			} catch (e) {
				// No launch arguments.
			}
			fetch("http://localhost:8099/tizentube/getState")
				.then(response => response.json())
				.then(state => {
					if (state.canConnectToDaemon && !state.isConnecting) {
						fetch(`http://localhost:8099/tizentube/debugger${args ? `?${args}` : ""}`);
						tizen.application.getCurrentApplication().exit();
					} else if (!state.canConnectToDaemon) {
						location.href = `http://localhost:8099/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8095%2Fdial%2Fapps%2FYouTube${args ? `&${args}` : ""}`;
					}
				}).catch(() => window.location.reload());
		}

		tizen.application.launchAppControl(
			new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
			serviceId,
			function () {
				useInjectorOrProxy();
			},
			function (e) {
				alert("Launch Service failed: " + e.message);
			}
		);
	</script>
</body>

</html>
